name: Validar dados e páginas

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Validar estrutura HTML e links locais
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import csv
          import sys

          root = Path(".")
          errors = []
          class Checker(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("href", "src"):
                      value = attrs.get(key, "")
                      if not value or value.startswith(("#", "http://", "https://", "mailto:", "tel:", "data:", "javascript:")):
                          continue
                      target = value.split("#", 1)[0].split("?", 1)[0]
                      if not target:
                          continue
                      candidate = (self.path.parent / target).resolve()
                      if not candidate.exists():
                          errors.append(f"{self.path}: link local inexistente: {value}")
          html_files = list(root.rglob("*.html"))
          if not html_files:
              errors.append("Nenhum arquivo HTML encontrado.")
          for path in html_files:
              try:
                  Checker(path).feed(path.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, OSError) as exc:
                  errors.append(f"{path}: não foi possível ler HTML: {exc}")
          csv_files = list(root.rglob("*.csv"))
          for path in csv_files:
              try:
                  with path.open("r", encoding="utf-8-sig", newline="") as handle:
                      reader = csv.DictReader(handle)
                      headers = reader.fieldnames or []
                      if not headers:
                          errors.append(f"{path}: CSV sem cabeçalho.")
                          continue
                      if len(headers) != len(set(headers)):
                          errors.append(f"{path}: cabeçalhos duplicados.")
                      rows = list(reader)
                      if not rows:
                          errors.append(f"{path}: CSV sem registros.")
                      for row_number, row in enumerate(rows, start=2):
                          if None in row or any(value is None for value in row.values()):
                              errors.append(f"{path}:{row_number}: número de campos incompatível com o cabeçalho.")
                          if "year" in row and row["year"] and not row["year"].isdigit():
                              errors.append(f"{path}:{row_number}: ano inválido: {row['year']}")
                          if "count" in row and row["count"] and not row["count"].isdigit():
                              errors.append(f"{path}:{row_number}: contagem inválida: {row['count']}")
              except (UnicodeDecodeError, OSError, csv.Error) as exc:
                  errors.append(f"{path}: não foi possível validar CSV: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validação básica concluída: {len(html_files)} HTML(s), {len(csv_files)} CSV(s).")
          PY
